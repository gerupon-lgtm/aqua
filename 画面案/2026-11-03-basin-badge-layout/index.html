<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>噴水盤の高さバッジ 2案</title><style>body{margin:0;padding:20px;background:#e5eef7;color:#17314c;font-family:system-ui}h1{font-size:23px;margin:0 0 8px}p{margin:0 0 12px;font-size:14px}main{display:flex;gap:24px;flex-wrap:wrap}section{width:390px}h2{font-size:17px;margin:8px 0}iframe{display:block;width:390px;height:680px;border:1px solid #bbcedf;border-radius:10px;background:#eef5fb}button{font:inherit;padding:6px 14px;border:1px solid #90abc4;background:white;color:#17314c;border-radius:6px;margin-right:8px;cursor:pointer}</style><h1>噴水盤の高さバッジ｜配置比較</h1><p>本番と同じ画面・部品・計算。札の配置だけを変えた見本です。</p><nav><button data-state="empty">空の器</button><button data-state="water">水が流れた状態</button><button data-state="perfect">噴水と虹</button></nav><main><section><h2>A｜給水塔とそろえて上に置く</h2><iframe title="A 上に高さ" src="./screen.html?variant=a"></iframe></section><section><h2>B｜器の左下に2段で重ねる</h2><iframe title="B 左下に高さ" src="./screen.html?variant=b"></iframe></section></main><script>for(const b of document.querySelectorAll('button'))b.onclick=()=>{for(const [i,f]of [...document.querySelectorAll('iframe')].entries())f.src='./screen.html?variant='+['a','b'][i]+'&state='+b.dataset.state;};</script></html>
