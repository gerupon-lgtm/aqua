<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v0.14.4 仕上げの点検</title><link rel="stylesheet" href="../../src/ui/style.css"><style>body{height:auto;padding:20px;box-sizing:border-box}h1{font-size:20px}.copy-grid{display:grid;grid-template-columns:328px 382px;gap:18px}.sample{padding:0;background:#eef5fb;border:1px solid #cfdbe7}.sample h2{font-size:14px;margin:0 0 8px}.sample .guide{font-size:14px;line-height:1.6;min-height:120px}.art-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:1040px}.art-grid img{width:100%;height:auto;background:#eef5fb}figure{margin:0}figcaption{font-size:14px}pre{white-space:pre-wrap;font-size:13px}</style><h1>本番の案内文と説明の挿絵</h1><p>文は同じ描画関数。幅328・382は、360・414pxの画面の左右余白を除いた値。</p><pre id="audit">測定中</pre><div class="copy-grid" id="copies"></div><h2>説明の挿絵：文字なし・960×360・透過SVG</h2><div class="art-grid" id="art"></div><script type="module">
import {LESSONS,PRACTICE_STEPS} from '../../src/content/tutorial.js';
import {guideMessage} from '../../src/ui/guide-copy.js';
const texts=[...PRACTICE_STEPS.map(s=>s.text),...Object.values(LESSONS).map(s=>s.intro)];
for(let i=0;i<texts.length;i++)for(const width of [328,382]){const box=document.createElement('section');box.className='sample';box.style.width=width+'px';box.innerHTML=`<h2>${i+1}：${width+32}px画面</h2><p class="hint guide">${guideMessage(texts[i])}</p>`;document.getElementById('copies').append(box);}
for(const id of ['gate','outlets','adjustable','height','siphon'])document.getElementById('art').insertAdjacentHTML('beforeend',`<figure><figcaption>intro-${id}</figcaption><img src="../../public/graphics/intro-${id}.svg" alt="${id}"></figure>`);
await document.fonts.ready;
const samples=[...document.querySelectorAll('.sample')].map(s=>{const p=s.querySelector('.guide'),copy=s.querySelector('.guide-copy');return{label:s.querySelector('h2').textContent,height:p.getBoundingClientRect().height,width:copy.clientWidth,overflow:copy.scrollWidth>copy.clientWidth,phrases:[...copy.querySelectorAll('.phrase')].map(n=>({text:n.textContent,wide:n.getBoundingClientRect().width>copy.clientWidth}))};});
document.getElementById('audit').textContent=JSON.stringify({samples:samples.length,overflow:samples.filter(s=>s.overflow||s.phrases.some(p=>p.wide)),maxHeight:Math.max(...samples.map(s=>s.height)),details:samples},null,2);
</script></html>
