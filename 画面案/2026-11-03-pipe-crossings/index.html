<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配管の交差の点検</title><link rel="stylesheet" href="../../src/ui/style.css"><style>body{height:auto;padding:18px}h1{font-size:22px;margin:0 0 12px}nav{display:flex;gap:10px;margin-bottom:15px}select,button{font:inherit;padding:6px}svg{display:block;width:720px;height:240px}pre{white-space:pre-wrap}</style><h1>配管の交差｜本番の描画で確認</h1><nav><label>面 <select id="stage"><option>T8</option><option>T9</option><option>T12</option><option>T21</option><option>T22</option><option>T24</option></select></label><label>状態 <select id="state"><option value="empty">未接続</option><option value="on">接続・編集</option><option value="water">水を流した後</option><option value="front">横の管だけ接続</option><option value="back">縦の管側を接続</option></select></label></nav><svg id="board" viewBox="0 350 360 120"></svg><pre id="report"></pre><script type="module">
import {STAGES} from '../../src/content/stages.js';
import {analyzeStage,evaluate,normalizeConfig,thinnessOf} from '../../src/logic/play.js';
import {renderBoard,layoutFor,pipeCrossings} from '../../src/ui/board.js';
const stageChoice=document.querySelector('#stage'),stateChoice=document.querySelector('#state'),svg=document.querySelector('#board');
function draw(){const stage=STAGES.find(s=>s.id===stageChoice.value),state=stateChoice.value,layout=layoutFor(stage),config=normalizeConfig({connected:state==='empty'?[]:state==='front'?['SB']:state==='back'?['SA',stage.candidates.some(c=>c.id==='AC')?'AC':'AB']:stage.candidates.map(c=>c.id),primed:[],thickness:{}}),ev=evaluate(stage,config,analyzeStage(stage)),view=ev.states[0];
renderBoard(svg,{stage,layout,connected:config.connected,primed:config.primed,thinness:c=>thinnessOf(c,config),phase:['empty','on'].includes(state)?'edit':'result',settled:!['empty','on'].includes(state),view,levels:new Map(),prevLevels:new Map(),time:0,reducedMotion:true,onScale:()=>false,tickDistance:()=>1});
const crosses=pipeCrossings(layout,stage);svg.dataset.probeX=crosses[0].left;svg.dataset.probeY=crosses[0].y+2;document.querySelector('#report').textContent=JSON.stringify({stage:stage.id,state,crosses},null,2);}
stageChoice.onchange=stateChoice.onchange=draw;draw();
</script></html>
