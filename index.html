<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- app:head:start -->
<title>AQUA NOTES 試作</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- app:head:end -->
<!-- OFFLINE_METADATA -->
<link rel="stylesheet" href="./src/ui/style.css">
</head>
<body>
<!-- app:body:start -->
<!-- タイトル画面（前作 prism に合わせる）。背景の絵とタイトルの一言は T-13 で決める（いまは仮） -->
<section class="title-screen" id="title" aria-label="アクア・ノーツのタイトル">
  <div class="title-inner">
    <div class="title-hero">
      <div class="series-logo" aria-label="SIKUMI NOTES 02"><span>SIKUMI</span><span>NOTES</span><b>02</b></div>
      <h1 class="title-logo" aria-label="AQUA NOTES"><svg viewBox="0 0 1000 440" aria-hidden="true"><text class="aqua" x="500" y="260">AQUA</text><text class="notes" x="500" y="420">NOTES</text></svg></h1>
      <p class="title-lead">水をつなぎ、グラスを鳴らす。</p>
      <div class="title-symbols" aria-hidden="true">
        <span class="title-emblem title-spirit"></span><i></i>
        <span class="title-emblem title-glass"></span><i></i>
        <span class="title-emblem title-fountain"></span>
      </div>
    </div>
    <nav class="title-menu" aria-label="はじめのメニュー"><div class="title-buttons">
      <button type="button" class="big" data-title="tutorial">チュートリアル</button>
      <button type="button" class="big" data-title="continuous">連続プレイ</button>
      <div class="pair"><button type="button" data-title="select">選択プレイ</button><button type="button" data-title="free">自由作成</button></div>
      <div class="pair"><button type="button" data-title="parts">パーツの説明</button><button type="button" data-title="howto">遊び方と概要</button></div>
      <button type="button" data-title="resume" disabled>プレイ画面へ</button>
    </div>
    <p class="title-message" id="title-message" role="status"></p>
    <footer class="title-foot"><span>© SIKUMI LAB</span><span id="title-version"></span></footer>
    </nav>
  </div>
  <button type="button" class="title-update" data-title="update" hidden>更新</button>
</section>
<div class="app" id="app">
  <header class="bar">
    <div class="logo" aria-label="AQUA NOTES"><span class="l1">AQUA</span><span class="l2">NOTES</span></div>
    <p class="desktop-tagline">水をつなぎ、グラスを鳴らす。</p>
    <div class="tools">
      <button type="button" id="records">記録</button>
      <button type="button" id="sound" aria-pressed="true">音 オン</button>
      <button type="button" id="menu" aria-label="メニュー">☰</button>
    </div>
  </header>
  <section class="cond" id="cond" aria-live="polite"></section>
  <main class="board-wrap">
    <svg id="board" role="img" aria-label="真横から見た配管の断面" preserveAspectRatio="xMidYMax meet"></svg>
    <div class="board-footer"><div id="board-aux" class="board-aux"></div><div class="board-legend">
      <div class="connection-key" aria-hidden="true"><span><i></i>接続済み</span><span><i class="candidate"></i>つなげる配管</span></div>
      <div id="pipe-key" class="pipe-key" aria-label="管の数字の凡例：太は1、中は2、細は3。同じ高さの差なら、数字が小さいほど多く流れる。">
        <span class="key-title">管の数字</span><span class="key-pairs"><span class="key-sample"><span>太</span><b>1</b></span><span class="key-sample"><span>中</span><b>2</b></span><span class="key-sample"><span>細</span><b>3</b></span></span><span class="key-meaning">同じ高さの差なら<br>数字が小さいほど多く流れる</span>
      </div>
    </div></div>
  </main>
  <dialog class="toast" id="toast" aria-label="配管の設定"></dialog>
  <section class="panel" id="panel"></section>
  <div class="result-toast" id="result-toast" hidden></div>
  <footer class="foot"><span><span id="version"></span> 試作</span><span>© SIKUMI LAB</span></footer>
</div>
<!-- シートと更新の案内は、タイトル画面からも使うので #app の外に置く -->
<div class="sheet" id="sheet" hidden></div>
<div class="notice" id="update-notice" hidden role="status"><span>新しい版があります。</span><button type="button" id="update-apply">更新する</button></div>
<!-- app:body:end -->
<script type="module" src="./src/ui/app.js"></script>
</body>
</html>
