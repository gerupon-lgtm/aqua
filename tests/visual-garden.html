 if(!card||!statusBox||card.dataset.status!==expected||(expected==='empty'?!!mark:mark?.dataset.mark!==(expected==='ok'?'check':'minus')))errors.push({...tag,outlet:id,kind:'status box or mark differs from result'});
 const fill=card?.querySelector('rect')?.getAttribute('fill');if((expected==='ok'&&fill!=='#1d56a0')||(expected==='ng'&&fill!=='#dc5a2c'))errors.push({...tag,outlet:id,kind:'incorrect original OK or NG colour'});

 const text=card.querySelector(variant==='one'?'.quantity-label':'.quantity-rate'),tb=text?.getBBox(),sb=statusBox?.getBBox();if(text&&tb&&sb){const right=point(text,tb.x+tb.width,tb.y).x,left=point(statusBox,sb.x,sb.y).x;if(right>=left-.3)errors.push({...tag,outlet:id,kind:'text touches fixed checkbox'});if(variant==='one'&&(left-right<2||left-right>6))errors.push({...tag,outlet:id,kind:'one-line checkbox gap is not compact',gap:left-right});}
}
