<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>部品描画の動作点検</title><link rel="stylesheet" href="../src/ui/style.css"><style>body{height:auto;margin:0;padding:8px}h1{font-size:16px;margin:0 0 4px}button{font-size:13px}pre{font-size:11px;white-space:pre-wrap;margin:4px 0}#board{width:360px;height:470px;display:block}</style><h1>v0.14.12：本体の描画時間</h1><button id="measure">3つの噴水盤で測る</button><pre id="report">待機中</pre><svg id="board" viewBox="0 0 360 470"></svg><script type="module">
import{BASES,getCase,modelFor}from'./visual-fixtures.js';import{renderElbow}from'./visual-render.js';
let busy=false;document.querySelector('#measure').onclick=async()=>{if(busy)return;busy=true;await document.fonts.ready;const item=getCase(BASES.find(s=>s.id==='T23'),0),{model}=modelFor(item,'perfect'),svg=document.querySelector('#board'),report=document.querySelector('#report');model.reducedMotion=false;const times=[],gaps=[],frames=new Set(),drops=new Set();let n=0,prev=null;
function tick(now){model.time=1800+n*34;const start=performance.now();renderElbow(svg,model);const elapsed=performance.now()-start;if(n>=15){times.push(elapsed);if(prev!=null)gaps.push(now-prev);}prev=now;frames.add(svg.querySelector('.fountain-core image')?.getAttribute('href'));drops.add(svg.querySelector('.fountain-spray ellipse')?.getAttribute('cy'));n++;if(n<115){report.textContent=`${n}/115 フレーム`;requestAnimationFrame(tick);}else{const sorted=[...times].sort((a,b)=>a-b),mean=times.reduce((a,b)=>a+b,0)/times.length,frameMean=gaps.reduce((a,b)=>a+b,0)/gaps.length;report.textContent=JSON.stringify({frames:times.length,outlets:model.stage.outlets.length,meanRenderMs:mean,p95RenderMs:sorted[Math.floor(sorted.length*.95)],maxRenderMs:sorted.at(-1),meanFrameMs:frameMean,observedFps:1000/frameMean,fountainFrames:frames.size,dropletPositions:drops.size,viewport:[innerWidth,innerHeight]},null,2);busy=false;}}
requestAnimationFrame(tick);};
</script></html>
